name: AI Test Review

# Reviews the test code in every pull request with the configured LLM and
# posts the result as a PR comment. Advisory: it never fails the PR.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# A new push to the same PR cancels the review still running for the old one.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI review of test code
    runs-on: ubuntu-latest
    env:
      # Claude is the default; set repository variable LLM_PROVIDER to 'gemini' to switch.
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout (full history, for the diff against the base branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Review and comment
        run: npm run review:pr
